name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev,hub]"
      - name: Shell and Python syntax
        run: |
          bash -n start.sh stop.sh setup.sh scripts/download_models.sh scripts/serve_model.sh
          python -m compileall -q mcbench scripts tests
      - name: Style and offline regressions (no GPU or X11)
        env:
          DISPLAY: ''
          WAYLAND_DISPLAY: ''
          CUDA_VISIBLE_DEVICES: ''
        run: |
          ruff check mcbench scripts tests
          ruff format --check mcbench scripts tests
          python -m unittest discover -s tests -v
          mcbench replay tests/fixtures/golden/replay.json
      - name: Build and test installed wheel outside checkout
        run: |
          python -m build --wheel
          python -m venv /tmp/mcbench-wheel
          /tmp/mcbench-wheel/bin/pip install dist/*.whl
          cd /tmp
          env -u DISPLAY -u WAYLAND_DISPLAY -u PYTHONPATH MCBENCH_WORKSPACE="$GITHUB_WORKSPACE" /tmp/mcbench-wheel/bin/mcbench replay "$GITHUB_WORKSPACE/tests/fixtures/golden/replay.json"
          env -u DISPLAY -u WAYLAND_DISPLAY -u PYTHONPATH MCBENCH_WORKSPACE="$GITHUB_WORKSPACE" /tmp/mcbench-wheel/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Clean checkout entry points
        run: |
          ./setup.sh --doctor
          ./start.sh --help
          ./stop.sh --help
          printf '0\n' | ./setup.sh
