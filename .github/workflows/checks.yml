name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-hub.txt
      - name: Shell and Python syntax
        run: |
          bash -n start.sh stop.sh setup.sh scripts/download_models.sh scripts/serve_model.sh
          python -m compileall -q src scripts tests
      - run: python -m unittest discover -s tests -v
      - name: Clean checkout entry points
        run: |
          ./setup.sh --doctor
          ./start.sh --help
          ./stop.sh --help
          printf '0\n' | ./setup.sh
